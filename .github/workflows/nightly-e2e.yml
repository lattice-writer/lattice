name: Nightly e2e

# The full gate on main once a night: the gate, the GPUI release build and the
# whole e2e scenario (scripts/gpui-nightly.mjs, through
# scripts/gpui-main-baseline.mjs), then the whole Vitest suite. A branch's
# gate runs the smoke flow and the e2e modules its diff picks
# (scripts/ci-local-select.mjs) and the tests within two imports of its change
# (scripts/lib/import-graph.mjs), so this is where the rest runs; a failure
# here is fixed the next day.
#
# On the Mac mini through runner-up's lattice-mac pool, as the release jobs
# (docs/release-process.md), under the in-app lock every windowed run there
# takes, so no crew gate or hand test drives the screen under it. It takes
# that lock per chunk of e2e modules and lets it go in between, so a queued
# gate or lab run waits minutes, not the whole scenario. The
# repository variable LATTICE_MACOS_RUNNER moves it with the release jobs.
# Holding runner-up's one place, a release tag pushed meanwhile waits for it.
#
# It keeps one issue labelled nightly-e2e in step with what failed: opened on
# the first failure, rewritten while failures persist with a comment for each
# new one, closed on the first green night.
on:
  schedule:
    # 18:37 UTC, 02:37 in Taipei: after the day's merges, off the hour.
    - cron: "37 18 * * *"
    # Backups: GitHub delays scheduled runs and sometimes drops them (none
    # fired on 2026-11-26). A backup runs the night only when no run of this
    # workflow has started since 18:00 UTC (the due job).
    - cron: "47 19 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  # A scheduled run goes ahead only if it is the night's first: a run of this
  # workflow started since 18:00 UTC (scheduled or by hand, and not cancelled)
  # already covers the night. A run by hand always goes ahead, and so does one
  # whose check fails: a duplicate night costs Mac time, a lost one a day.
  due:
    if: github.repository == 'lattice-writer/lattice' || github.repository == 'leo1oel/lattice'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT" != schedule ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d "$(date -u +%F) 18:00" +%s)
          if [ "$since" -gt "$(date -u +%s)" ]; then since=$((since - 86400)); fi
          started=$(gh api "repos/$REPO/actions/workflows/nightly-e2e.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID and .conclusion != \"cancelled\" and (.created_at | fromdateiso8601) >= $since)] | length") \
            || { echo "could not list the night's runs; running"; started=0; }
          echo "night's runs so far: $started"
          if [ "$started" = 0 ]; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi

  e2e:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ${{ vars.LATTICE_MACOS_RUNNER || 'lattice-mac' }}
    timeout-minutes: 615
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # gpui-main-baseline.mjs moves latest.json only to a descendant of
          # the commit it names, which a shallow clone cannot tell.
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      # The shared build tree (~/Library/Caches/lattice-gpui-build) lives on
      # the external SSD. A process runner-up starts needs macOS's Removable
      # Volumes permission there, and without it the first file access waits
      # on a prompt nobody answers (run 45659115285 hung 35 min holding the
      # in-app lock). Fail fast, before the lock, so the report still runs.
      - name: Reach the shared build tree
        timeout-minutes: 2
        run: |
          dir="${LATTICE_GPUI_BUILD_DIR:-$HOME/Library/Caches/lattice-gpui-build}"
          mkdir -p "$dir/main-baseline" && ls "$dir/main-baseline" >/dev/null
      # Each chunk of modules, and the rerun, waits up to 90 minutes for the
      # in-app lock (scripts/gpui-main-baseline.mjs --chunks); one that gives
      # up is an error in the record, which the report counts. Its own
      # timeout leaves the job time for the report.
      - name: Gate, release build, the whole e2e and the whole Vitest suite on main
        timeout-minutes: 590
        run: node scripts/gpui-nightly.mjs run
      - name: Open, update or close the nightly issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gpui-nightly.mjs report
