name: User guide

# The user guide (docs/guide/, rendered by scripts/user-guide.mjs) on the
# website's gh-pages branch under guide/ (https://lattice-writer.github.io/lattice/guide/),
# which Help ▸ User Guide opens in both apps.
#
# - A push to main that changes the guide or its renderer publishes it, so a
#   guide fix is live within minutes. Guide pages land on main with the
#   pull request that builds what they describe, so between releases the
#   website can describe a feature a day or two before it ships; the pages
#   say "in the native Lattice" or name the version where that matters.
#   Only guide/ is written: the site's own files belong to the website,
#   and demo/ to web-demo.yml.
# - Run by hand (workflow_dispatch) it renders and publishes the chosen ref.
on:
  push:
    branches: [main]
    paths:
      - docs/guide/**
      - scripts/user-guide.mjs
      - scripts/lib/util.mjs
      - .github/workflows/user-guide.yml
  workflow_dispatch:

# A newer push to main cancels the run before it, started or not; each run
# renders and pushes guide/ whole, so the newest one leaves the site right.
concurrency:
  group: user-guide-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: node scripts/user-guide.mjs --out "$RUNNER_TEMP/guide"
      - uses: actions/upload-artifact@v7
        with:
          name: user-guide
          path: ${{ runner.temp }}/guide
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shares web-demo.yml's group: one push to gh-pages at a time. GitHub
    # keeps one pending job per group, so a guide publish queued behind
    # another can replace a pending web-demo publish (and the reverse);
    # docs/release-process.md says to check the demo after a release.
    concurrency:
      group: web-demo-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: user-guide
          path: ${{ runner.temp }}/guide
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
      - name: Replace guide/ on gh-pages
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd site
          rsync -a --delete "$RUNNER_TEMP/guide/" guide/
          git add --all guide
          if git diff --cached --quiet; then
            echo "guide/ is already this build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Publish the user guide for $REF (${SHA:0:7})"
          for attempt in 1 2 3; do
            git push origin HEAD:gh-pages && exit 0
            sleep $((attempt * 5))
            git pull --rebase origin gh-pages
          done
          exit 1
