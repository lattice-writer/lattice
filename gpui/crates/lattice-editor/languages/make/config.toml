name = "Makefile"
grammar = "make"
path_suffixes = ["mk", "mak", "make", "Makefile", "makefile", "GNUmakefile"]
line_comments = ["# "]
hard_tabs = true
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
